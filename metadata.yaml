name: astrbot_plugin_checkin_shop
display_name: 打卡积分商店
short_desc: 打卡积分、商品兑换与可选虚拟股市、积分通、竞猜、刮奖和道具
description: |
  一个完整的"打卡赚积分 + 积分兑换"插件：
  * 指令：/打卡 /商店 /我的积分 /积分榜 /兑换商品 <名称> /绑定邮箱 <邮箱> /商店帮助
  * 打卡积分规则（固定 / 随机区间 / 自定义列表 + 连签奖励）可在 WebUI 配置，插件页与配置页互通
  * 商品在 WebUI 插件页里可视化增删改（名称、价格、库存、限购、分类、图片）
  * /商店 用本地 Pillow 渲染图片，自动把商品分成"可兑换"与"暂不可兑换"，并显示所差积分
  * 图片回复达到 200 字只发图片，短回复文字加图片；图片失败保留完整文字
  * 兑换为两步确认：回复引用消息后发送 是/否，避免误操作
  * 兑换记录在后台流转（待发放 / 已发放 / 已取消，可返还积分与库存），可删除
  * 标记发放后自动通知用户：会话提示 +（可选）SMTP 发放邮件，收件邮箱可用 /绑定邮箱 绑定
  * 默认关闭的积分娱乐：虚拟股市、活期积分通、奖池竞猜、刮刮乐与两类结构化道具
  * 每日额度跨群共享，支持持久确认、离线补结算、后台玩法管理与资产查账
version: v1.4.3
author: AstrBot plugin community
repo: https://github.com/l52312516-cell/astrbot_plugin_checkin_shop
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - webchat
