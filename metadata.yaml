name: astrbot_plugin_checkin_shop
display_name: 打卡积分商店
short_desc: 每日打卡得积分，积分可在后台配置的商店里兑换商品（图文渲染）
description: |
  一个完整的"打卡赚积分 + 积分兑换"插件：
  * 指令：/打卡 /商店 /我的积分 /积分榜 /兑换商品 <名称>
  * 打卡积分规则（固定 / 随机区间 / 自定义列表 + 连签奖励）可在 WebUI 配置
  * 商品在 WebUI 插件页里可视化增删改（名称、价格、库存、限购、分类、图片）
  * /商店 用本地 Pillow 渲染图片，自动把商品分成"可兑换"与"暂不可兑换"，并显示所差积分
  * 兑换为两步确认：回复引用消息后发送 是/否，避免误操作
  * 兑换记录在后台流转（待发放 / 已发放 / 已取消，可返还积分与库存）
version: v1.0.0
author: AstrBot plugin community
repo: https://github.com/l52312516-cell/astrbot_plugin_checkin_shop
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - webchat
